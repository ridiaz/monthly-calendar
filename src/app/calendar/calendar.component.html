<form>
  <h2>Monthly calendar</h2>
  <div>
    <label>Start date (ex. 8/15/2008):</label>
    <input name="startDate" #newStartDate>
  </div>
  <div>
    <label>Number of days:</label>
    <input name="#newNumberOfDays" #newNumberOfDays>
  </div>
  <div>
    <label>Country Code:</label>
    <input name="#newCountryCode" #newCountryCode>
  </div>
  <button (click)="generate(newStartDate, newNumberOfDays, newCountryCode)">
    Show calendar
  </button>
</form>
<table *ngFor="let month of viewMonths">
  <tr>
    <td *ngFor="let weekDay of weekDays">{{weekDay}}</td>
  </tr>
  <tr>
    <td colspan="7" style="text-align: center">{{month.key}}</td>
  </tr>
  <tr *ngFor="let week of month.weeks">
    <td appColorCoded [colorClass]="cell.colorClass" *ngFor="let cell of week">
      <label title="{{cell.holidayName}}">{{cell.label}}</label>
    </td>
  </tr>
</table>
